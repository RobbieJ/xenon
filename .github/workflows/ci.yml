name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  package-linux:
    name: SottoKit tests (Linux, Swift 6.3)
    runs-on: ubuntu-24.04
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: Packages/SottoKit
        run: swift test --parallel

  package-macos:
    name: SottoKit tests (macOS, includes AVFAudio and CoreBluetooth code)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Test
        working-directory: Packages/SottoKit
        run: swift test --parallel

  app-ios:
    name: Sotto app build (iOS, no signing)
    runs-on: macos-26
    # Needs Xcode 27 for the iOS 27 SDK. Advisory until the runner images carry it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Print SDK interfaces we depend on
        # The iOS SDK's Swift interfaces are the ground truth for the Wi-Fi Aware, DeviceDiscoveryUI
        # and Network APIs; printing the declarations lets the log answer API questions without a Mac.
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          f=$(find "$SDK/System/Library/Frameworks/DeviceDiscoveryUI.framework" -name 'arm64*.swiftinterface' | head -1)
          echo "=== DeviceDiscoveryUI"
          grep -nE 'DevicePicker|DevicePairingView|public init|public func|public static' "$f" | head -80
          f=$(find "$SDK/System/Library/Frameworks/Network.framework" -name 'arm64*.swiftinterface' | head -1)
          echo "=== Network (subset)"
          grep -nE 'struct Message|var content|var metadata|func receive|func send<|func send\(_ content|class NetworkConnection|var currentPath|struct UDP' "$f" | head -60
          f=$(find "$SDK/System/Library/Frameworks/LiveCommunicationKit.framework" -name 'arm64*.swiftinterface' | head -1)
          echo "=== LiveCommunicationKit"
          grep -nE '^public|^  public|^    public' "$f" | grep -vE 'encode\(|init\(from decoder|hashValue|func hash|static func ==' | head -220
      - name: Build for device without signing
        run: |
          set -o pipefail
          xcodebuild -project Sotto.xcodeproj -scheme Sotto -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build 2>&1 | grep -E 'error:|warning: unused|BUILD (SUCCEEDED|FAILED)|\*\*' 
