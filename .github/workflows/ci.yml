name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  package-linux:
    name: SottoKit tests (Linux, Swift 6.3)
    runs-on: ubuntu-24.04
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: Packages/SottoKit
        run: swift test --parallel

  package-macos:
    name: SottoKit tests (macOS, includes AVFAudio and CoreBluetooth code)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Test
        working-directory: Packages/SottoKit
        run: swift test --parallel

  app-ios:
    name: Sotto app build (iOS, no signing)
    runs-on: macos-26
    # Needs Xcode 27 for the iOS 27 SDK. Advisory until the runner images carry it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Print SDK interfaces we depend on
        # The iOS SDK's Swift interfaces are the ground truth for the Wi-Fi Aware, DeviceDiscoveryUI
        # and Network APIs; printing the declarations lets the log answer API questions without a Mac.
        run: |
          set +e   # this step is informational; a grep with no matches must not fail the job
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "=== DeviceDiscoveryUI (Swift interfaces and ObjC header)"
          for f in $(find "$SDK/System/Library/Frameworks/DeviceDiscoveryUI.framework" -name '*.swiftinterface' | grep arm64e); do echo "--- $f"; grep -nE 'DevicePicker|DevicePairing|func |init' "$f" | head -60 || true; done
          find "$SDK/System/Library/Frameworks/DeviceDiscoveryUI.framework/Headers" -name '*.h' | while read h; do echo "--- $h"; grep -nE '^@interface|^- \(|^\+ \(|^@property|typedef' "$h" || true; done
          echo "--- DDDevicePickerViewController.h (full)"; sed -n '1,60p' "$SDK/System/Library/Frameworks/DeviceDiscoveryUI.framework/Headers/DDDevicePickerViewController.h"
          echo "--- swiftinterface lines 20-60"; sed -n '20,60p' "$(find "$SDK/System/Library/Frameworks/DeviceDiscoveryUI.framework" -name 'arm64e*.swiftinterface' | head -1)"
          f=$(find "$SDK/System/Library/Frameworks/LiveCommunicationKit.framework" -name 'arm64e*.swiftinterface' | head -1)
          echo "=== LiveCommunicationKit (manager, delegate, events)"
          grep -nE 'class ConversationManager|protocol ConversationManagerDelegate|func conversationManager|func report|func perform|var delegate|case |AudioSession|class Conversation |struct StartConversationAction|struct JoinConversationAction|struct EndConversationAction|struct MuteConversationAction|struct ConversationAction|protocol ConversationAction|fulfill|fail' "$f" | head -160 || true
      - name: Build for device without signing
        run: |
          set -o pipefail
          xcodebuild -project Sotto.xcodeproj -scheme Sotto -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build 2>&1 | grep -E 'error:|warning: unused|BUILD (SUCCEEDED|FAILED)|\*\*' 
